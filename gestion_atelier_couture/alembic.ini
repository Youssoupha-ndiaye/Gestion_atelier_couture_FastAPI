# Configuration Alembic (migrations du schéma de la base).
# ⚠ L'URL de la base n'est PAS écrite ici : alembic/env.py la lit depuis
#   les variables d'environnement / .env (Settings.DATABASE_URL).

[alembic]
script_location = alembic
prepend_sys_path = .
# Noms de fichiers lisibles : 20261104_1200-<rev>_schema_initial.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
